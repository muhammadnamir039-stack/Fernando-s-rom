<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Fernando's room</title>
<style>
:root{--blue:#1a73e8;--blue2:#174ea6;--text:#202124;--muted:#5f6368;--line:#dadce0;--bg:#f8fafd;--green:#188038;--shadow:0 1px 3px #0002}*{box-sizing:border-box}body{margin:0;color:var(--text);font:15px Arial,Helvetica,sans-serif;background:white}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:64px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:0 22px;background:white;border-bottom:1px solid var(--line)}.hamb{border:0;background:transparent;font-size:21px;color:var(--muted)}.brand{display:flex;align-items:center;gap:11px;font-size:20px;color:#5f6368}.brand-icon{width:34px;height:34px;border-radius:9px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold}.right{margin-left:auto;display:flex;align-items:center;gap:14px}.user{width:34px;height:34px;background:#7e57c2;color:white;border-radius:50%;display:grid;place-items:center;font-weight:bold}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:250px;border-right:1px solid var(--line);padding:18px 12px;flex:none}.nav{width:100%;border:0;background:none;border-radius:0 24px 24px 0;text-align:left;padding:0 17px;height:46px;color:#3c4043;display:flex;align-items:center;gap:17px}.nav:hover{background:#f1f3f4}.nav.active{background:#e8f0fe;color:var(--blue2);font-weight:bold}.nav span:first-child{width:19px;text-align:center;font-size:18px}.section-label{padding:24px 17px 8px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.class-list{max-height:45vh;overflow:auto}.class-nav{height:42px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dot{width:28px;height:28px;border-radius:50%;color:white;display:grid;place-items:center;font-size:12px;font-weight:bold;flex:none}.main{flex:1;min-width:0;max-width:1440px;margin:auto;padding:30px clamp(18px,4vw,58px) 55px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.heading h1{font-size:26px;font-weight:400;margin:0}.heading p{color:var(--muted);margin:7px 0 0}.btn{border:0;border-radius:5px;background:var(--blue);color:white;padding:10px 17px;box-shadow:var(--shadow);font-weight:600}.btn:hover{background:var(--blue2)}.btn.outline{background:white;color:var(--blue);border:1px solid var(--line);box-shadow:none}.btn.flat{background:transparent;color:var(--blue);box-shadow:none}.btn.small{padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;transition:box-shadow .15s}.card:hover{box-shadow:0 3px 10px #0002}.cover{height:120px;padding:18px;color:white;position:relative}.cover h2{font-size:22px;font-weight:500;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cover p{margin:0}.card-info{padding:15px;color:var(--muted);font-size:13px;min-height:60px}.card-foot{height:52px;border-top:1px solid #eee;display:flex;justify-content:flex-end;align-items:center;padding:0 12px}.icon{border:0;background:transparent;color:var(--muted);font-size:20px;width:40px;height:40px;border-radius:50%}.icon:hover{background:#f1f3f4}.empty{border:1px dashed var(--line);border-radius:10px;text-align:center;padding:48px 18px;color:var(--muted)}.empty .symbol{font-size:40px;margin-bottom:12px}.banner{height:210px;border-radius:10px;color:white;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:18px;position:relative;overflow:hidden}.banner:after{content:'F';font-size:240px;font-weight:bold;position:absolute;right:7%;top:-65px;opacity:.08}.banner h1{font-size:34px;font-weight:400;margin:0 0 9px;z-index:1}.banner p{margin:0;z-index:1}.tabs{height:54px;display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:23px;overflow:auto}.tab{background:transparent;border:0;color:var(--muted);padding:0 10px;white-space:nowrap;position:relative}.tab.active{color:var(--blue);font-weight:bold}.tab.active:after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--blue);border-radius:3px 3px 0 0}.columns{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:20px}.sharebox,.post,.sidebox,.task{border:1px solid var(--line);border-radius:9px;background:white}.sharebox{display:flex;align-items:center;gap:12px;padding:13px 15px;color:var(--muted);box-shadow:var(--shadow);cursor:pointer;margin-bottom:17px}.avatar{width:38px;height:38px;border-radius:50%;background:#188038;color:white;display:grid;place-items:center;font-weight:bold;flex:none}.post{margin-bottom:14px;overflow:hidden}.post-head{display:flex;align-items:center;gap:12px;padding:14px 16px}.post-head strong{font-weight:500}.post-head small{display:block;color:var(--muted);margin-top:4px}.post-body{padding:0 16px 17px;white-space:pre-wrap;line-height:1.5}.post-foot{border-top:1px solid #eee;padding:10px 15px;color:var(--muted);font-size:13px}.sidebox{padding:16px;margin-bottom:14px}.sidebox h3{font-size:16px;font-weight:500;margin:0 0 10px}.sidebox p{font-size:13px;color:var(--muted);line-height:1.5}.code{font-size:17px;letter-spacing:1px;color:var(--blue2);font-weight:bold}.task{padding:15px;display:flex;align-items:center;gap:13px;margin-bottom:12px;cursor:pointer}.task:hover{background:#fafafa}.task-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:#e8f0fe;font-size:19px;flex:none}.task-title{flex:1;min-width:0}.task-title strong{font-weight:500}.task-title small{display:block;color:var(--muted);margin-top:5px}.badge{background:#e6f4ea;color:var(--green);border-radius:20px;padding:5px 9px;font-size:12px;white-space:nowrap}.badge.pending{background:#fef7e0;color:#946200}.person{padding:13px 0;border-bottom:1px solid #eee;display:flex;align-items:center;gap:12px}.person:last-child{border:0}.person .avatar{background:#5c6bc0}.person small{display:block;color:var(--muted);margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500}.grade{width:72px;padding:7px;border:1px solid var(--line);border-radius:5px}.dialog-wrap{position:fixed;inset:0;background:#0006;z-index:20;display:grid;place-items:center;padding:16px}.dialog{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:12px;padding:24px;box-shadow:0 8px 35px #0003}.dialog h2{font-size:21px;font-weight:500;margin:0 0 20px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #9aa0a6;border-radius:5px;padding:11px}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus{outline:2px solid #a8c7fa;border-color:var(--blue)}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:white;padding:12px 18px;border-radius:6px;box-shadow:var(--shadow)}.note{font-size:12px;color:var(--muted);text-align:center;margin:30px 0 0}.menu-btn{display:none}
@media(max-width:760px){.top{height:58px;padding:0 12px}.layout{min-height:calc(100vh - 58px)}.menu-btn{display:block}aside{display:none;position:fixed;z-index:8;top:58px;bottom:0;left:0;background:white;box-shadow:3px 0 12px #0002}aside.open{display:block}.main{padding:22px 15px 40px}.heading h1{font-size:23px}.heading .btn{padding:9px 11px}.columns{grid-template-columns:1fr}.columns aside{display:block;position:static;width:auto;box-shadow:none;border:0;padding:0;order:-1}.banner{height:185px;padding:21px}.banner h1{font-size:29px}.tabs{gap:12px}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"><button class="hamb menu-btn" id="menuButton" aria-label="Abrir menu">☰</button><div class="brand"><div class="brand-icon">F</div><span>Fernando's room</span></div><div class="right"><button class="icon" id="helpButton" aria-label="Ajuda">?</button><div class="user">N</div></div></header>
<div class="layout"><aside id="sidebar"><button class="nav active" id="homeNav"><span>⌂</span>Início</button><button class="nav" id="todoNav"><span>▣</span>A fazer</button><div class="section-label">TURMAS <button class="icon" style="width:26px;height:26px" id="addClass" aria-label="Criar turma">＋</button></div><div id="classNav" class="class-list"></div><div style="border-top:1px solid #eee;margin:16px 0"></div><button class="nav" id="settingsNav"><span>⚙</span>Sobre este app</button></aside><main id="main" class="main"></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const STORAGE='fernandos_room_classroom_v2';
const colors=['linear-gradient(125deg,#4768b1,#283d79)','linear-gradient(125deg,#158e91,#07565b)','linear-gradient(125deg,#8152a8,#4f3178)','linear-gradient(125deg,#dd7956,#9f472e)','linear-gradient(125deg,#43875c,#24573a)'];
function initialData(){return {rooms:[{id:'fernando-room',name:"Fernando's room",subject:'Matemática',section:'Sala de Matemática',code:'FER2026',color:0,people:[{name:'Fernando',role:'Professor'},{name:'Namir Nehan',role:'Aluno'}],posts:[{id:'p1',body:'Bem-vindos ao Fernando’s room! Este é o mural da turma para avisos, materiais e atividades de Matemática.',author:'Fernando',created:new Date().toISOString()}],tasks:[]}]}}
function loadData(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&Array.isArray(x.rooms))return x}catch(e){}return initialData()}
let db=loadData(),activeRoom=null,activeTab='Mural',openTaskId=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(STORAGE,JSON.stringify(db))}function getRoom(id){return db.rooms.find(r=>r.id===id)}function formatDate(d){if(!d)return 'Sem data de entrega';return new Date(d+'T12:00:00').toLocaleDateString('pt-MZ',{day:'numeric',month:'short',year:'numeric'})}function shortDate(d){return new Date(d).toLocaleDateString('pt-MZ',{day:'numeric',month:'short',year:'numeric'})}
function showToast(text){const root=$('#toastRoot');root.innerHTML='<div class="toast">'+esc(text)+'</div>';setTimeout(()=>root.innerHTML='',2500)}
function setActiveNav(which){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));if(which==='home')$('#homeNav').classList.add('active');if(which==='todo')$('#todoNav').classList.add('active')}
function renderNav(){ $('#classNav').innerHTML=db.rooms.map(r=>`<button class="nav class-nav" data-room="${esc(r.id)}"><span class="dot" style="background:${['#536dbe','#16868a','#8152a8','#c16b48','#43875c'][r.color%5]}">${esc(r.name.charAt(0).toUpperCase())}</span>${esc(r.name)}</button>`).join('') }
function goHome(){activeRoom=null;setActiveNav('home');renderHome();$('#sidebar').classList.remove('open')}
function renderHome(){renderNav();$('#main').innerHTML=`<div class="heading"><div><h1>Olá! 👋</h1><p>As tuas turmas e atividades num só lugar.</p></div><button class="btn" data-action="new-class">＋ Criar turma</button></div>${db.rooms.length?`<div class="grid">${db.rooms.map(r=>`<article class="card" data-open-room="${esc(r.id)}"><div class="cover" style="background:${colors[r.color%colors.length]}"><h2>${esc(r.name)}</h2><p>${esc(r.section||'')}</p></div><div class="card-info">${esc(r.subject||'Turma')}<br>${r.tasks.length} atividade(s) · ${r.people.length} participante(s)</div><div class="card-foot"><button class="icon" data-open-room="${esc(r.id)}" title="Abrir turma">▣</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="symbol">▣</div><p>Ainda não tens turmas.</p><button class="btn" data-action="new-class">Criar a primeira turma</button></div>`}<p class="note">Fernando's room · Os dados são guardados neste navegador.</p>`}
function openRoom(id,tab='Mural'){if(!getRoom(id))return;activeRoom=id;activeTab=tab;setActiveNav('none');renderRoom();$('#sidebar').classList.remove('open')}
function renderRoom(){const r=getRoom(activeRoom);if(!r){goHome();return}renderNav();$('#main').innerHTML=`<div class="banner" style="background:${colors[r.color%colors.length]}"><h1>${esc(r.name)}</h1><p>${esc(r.section||'')}${r.subject?' · '+esc(r.subject):''}</p></div><nav class="tabs">${['Mural','Atividades','Pessoas','Notas'].map(t=>`<button class="tab ${activeTab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</nav><section id="tabContent"></section>`;const c=$('#tabContent');if(activeTab==='Mural')c.innerHTML=streamHTML(r);if(activeTab==='Atividades')c.innerHTML=tasksHTML(r);if(activeTab==='Pessoas')c.innerHTML=peopleHTML(r);if(activeTab==='Notas')c.innerHTML=gradesHTML(r)}
function streamHTML(r){const posts=[...r.posts].sort((a,b)=>new Date(b.created)-new Date(a.created));return `<div class="columns"><section><div class="sharebox" data-action="new-post"><div class="avatar">N</div><span>Partilha um aviso com a turma...</span></div>${posts.length?posts.map(p=>`<article class="post"><div class="post-head"><div class="avatar">${esc((p.author||'F').charAt(0))}</div><div><strong>${esc(p.author||'Fernando')}</strong><small>${shortDate(p.created)}</small></div></div><div class="post-body">${esc(p.body)}</div><div class="post-foot">💬 Publicação da turma${p.taskId?` · <button class="btn flat small" data-task="${esc(p.taskId)}">Ver atividade</button>`:''}</div></article>`).join(''):'<div class="empty">Ainda não há publicações.</div>'}</section><aside><div class="sidebox"><h3>Código da turma</h3><p>Partilha este código para convidar alunos.</p><div class="code">${esc(r.code)}</div><button class="btn flat small" data-action="copy-code">Copiar código</button></div><div class="sidebox"><h3>Próximas atividades</h3><p>${r.tasks.filter(t=>!t.submitted).length?`${r.tasks.filter(t=>!t.submitted).length} atividade(s) por entregar.`:'Nenhuma atividade pendente.'}</p><button class="btn flat small" data-tab="Atividades">Ver atividades</button></div></aside></div>`}
function tasksHTML(r){return `<div class="heading"><div><h1 style="font-size:21px">Atividades da turma</h1><p>Consulta e entrega os trabalhos aqui.</p></div><button class="btn" data-action="new-task">＋ Criar atividade</button></div>${r.tasks.length?[...r.tasks].sort((a,b)=>new Date(b.created)-new Date(a.created)).map(t=>taskHTML(t,r.name)).join(''):`<div class="empty"><div class="symbol">▣</div><p>Ainda não há atividades.</p><button class="btn" data-action="new-task">Criar atividade</button></div>`}`}
function taskHTML(t,roomName){return `<article class="task" data-task="${esc(t.id)}"><div class="task-icon">▣</div><div class="task-title"><strong>${esc(t.title)}</strong><small>${esc(roomName)} · ${t.due?'Entrega: '+formatDate(t.due):'Sem prazo'} · ${Number(t.points)||100} pontos</small></div><span class="badge ${t.submitted?'':'pending'}">${t.submitted?'Entregue':'A fazer'}</span></article>`}
function peopleHTML(r){return `<div class="heading"><h1 style="font-size:21px">Professores</h1></div>${r.people.filter(p=>p.role==='Professor').map(personHTML).join('')}<div class="heading" style="border-top:1px solid var(--line);padding-top:20px;margin-top:20px"><h1 style="font-size:21px">Alunos (${r.people.filter(p=>p.role==='Aluno').length})</h1><button class="btn outline" data-action="add-student">＋ Adicionar aluno</button></div>${r.people.filter(p=>p.role==='Aluno').map(personHTML).join('')||'<p class="muted">Ainda não há alunos nesta turma.</p>'}`}
function personHTML(p){return `<div class="person"><div class="avatar">${esc(p.name.charAt(0).toUpperCase())}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div></div>`}
function gradesHTML(r){const students=r.people.filter(p=>p.role==='Aluno');return `<h1 style="font-size:21px;font-weight:400">Notas da turma</h1><p style="color:var(--muted)">Regista as notas por atividade (0 a 100).</p>${r.tasks.length&&students.length?`<div class="table-wrap"><table><thead><tr><th>Aluno</th>${r.tasks.map(t=>`<th>${esc(t.title)}</th>`).join('')}<th>Média</th></tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.name)}</td>${r.tasks.map(t=>`<td><input class="grade" type="number" min="0" max="100" value="${esc(t.grades?.[s.name]??'')}" data-grade-task="${esc(t.id)}" data-grade-student="${esc(s.name)}" aria-label="Nota de ${esc(s.name)}"></td>`).join('')}<td>${average(r,s.name)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><p>${students.length?'Cria uma atividade para começares a registar notas.':'Adiciona alunos à turma para gerir as notas.'}</p></div>`}`}
function average(r,name){const n=r.tasks.map(t=>t.grades?.[name]).filter(v=>v!==''&&v!=null&&!Number.isNaN(Number(v))).map(Number);return n.length?Math.round(n.reduce((a,b)=>a+b,0)/n.length)+'%':'—'}
function showModal(title,fields,button,action){$('#modalRoot').innerHTML=`<div class="dialog-wrap" data-close-background><div class="dialog"><h2>${esc(title)}</h2><form data-form-action="${action}">${fields}<div class="actions"><button type="button" class="btn outline" data-action="close-modal">Cancelar</button><button class="btn">${esc(button)}</button></div></form></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function openTask(id){const r=db.rooms.find(x=>x.tasks.some(t=>t.id===id));if(!r)return;const t=r.tasks.find(x=>x.id===id);openTaskId=id;showModal(t.title,`<p style="color:var(--muted)">${esc(r.name)}${t.due?' · Entrega: '+formatDate(t.due):''} · ${Number(t.points)||100} pontos</p><p style="white-space:pre-wrap;line-height:1.5">${esc(t.description||'Sem instruções adicionais.')}</p><div class="field"><label>A tua resposta / trabalho</label><textarea name="submission" placeholder="Escreve a tua resposta...">${esc(t.submission||'')}</textarea></div>${t.submitted?'<span class="badge">Entregue</span>':''}`,'Guardar entrega','submit-task')}
function showToDo(){activeRoom=null;setActiveNav('todo');const items=db.rooms.flatMap(r=>r.tasks.map(t=>({r,t})));$('#main').innerHTML=`<div class="heading"><div><h1>A fazer</h1><p>Atividades de todas as tuas turmas.</p></div></div>${items.length?items.map(({r,t})=>taskHTML(t,r.name)).join(''):'<div class="empty"><div class="symbol">✓</div><p>Não há atividades por agora.</p></div>'}`;$('#sidebar').classList.remove('open')}
function newClass(){showModal('Criar uma turma',`<div class="field"><label>Nome da turma *</label><input name="name" required placeholder="Ex.: Matemática 10ª classe"></div><div class="field"><label>Disciplina</label><input name="subject" placeholder="Ex.: Matemática"></div><div class="field"><label>Secção</label><input name="section" placeholder="Ex.: Turma A"></div>`,'Criar turma','create-class')}
function newPost(){showModal('Publicar no mural',`<div class="field"><label>Aviso ou mensagem *</label><textarea name="body" required placeholder="Escreve uma mensagem para a turma..."></textarea></div>`,'Publicar','create-post')}
function newTask(){showModal('Criar atividade',`<div class="field"><label>Título *</label><input name="title" required placeholder="Ex.: Exercícios sobre frações"></div><div class="field"><label>Instruções</label><textarea name="description" placeholder="Explica o que os alunos devem fazer..."></textarea></div><div class="field"><label>Data de entrega</label><input name="due" type="date"></div><div class="field"><label>Pontos</label><input name="points" type="number" min="0" value="100"></div>`,'Criar atividade','create-task')}
function handleSubmit(e){const form=e.target.closest('form[data-form-action]');if(!form)return;e.preventDefault();const action=form.dataset.formAction,fd=new FormData(form),get=k=>String(fd.get(k)||'').trim();if(action==='create-class'){const r={id:'room-'+Date.now(),name:get('name'),subject:get('subject'),section:get('section'),code:Math.random().toString(36).slice(2,8).toUpperCase(),color:db.rooms.length%colors.length,people:[{name:'Fernando',role:'Professor'}],posts:[],tasks:[]};db.rooms.push(r);save();closeModal();openRoom(r.id);showToast('Turma criada!')}
else if(action==='create-post'){const r=getRoom(activeRoom);r.posts.push({id:'post-'+Date.now(),body:get('body'),author:'Fernando',created:new Date().toISOString()});save();closeModal();renderRoom();showToast('Aviso publicado.')}
else if(action==='create-task'){const r=getRoom(activeRoom),id='task-'+Date.now(),title=get('title'),description=get('description'),due=get('due');const t={id,title,description,due,points:Number(get('points'))||100,created:new Date().toISOString(),submitted:false,grades:{}};r.tasks.push(t);r.posts.push({id:'post-'+Date.now(),body:`Nova atividade: ${title}${description?'\n'+description:''}`,author:'Fernando',created:new Date().toISOString(),taskId:id});save();closeModal();renderRoom();showToast('Atividade criada.')}
else if(action==='submit-task'){for(const r of db.rooms){const t=r.tasks.find(x=>x.id===openTaskId);if(t){t.submission=get('submission');t.submitted=true;save();break}}closeModal();activeRoom?renderRoom():showToDo();showToast('Entrega guardada.')}
else if(action==='add-student'){const r=getRoom(activeRoom),name=get('name');if(name&&!r.people.some(p=>p.name.toLowerCase()===name.toLowerCase())){r.people.push({name,role:'Aluno'});save()}closeModal();renderRoom();showToast('Aluno adicionado.')}else if(action==='close-info'){closeModal()}}
function copyCode(){const r=getRoom(activeRoom);if(!r)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(r.code).then(()=>showToast('Código copiado: '+r.code)).catch(()=>showToast('Código: '+r.code))}else showToast('Código da turma: '+r.code)}
function handleClick(e){const target=e.target.closest('button,[data-open-room],[data-task],[data-action],[data-tab]');if(!target)return;if(target.id==='homeNav'){goHome();return}if(target.id==='todoNav'){showToDo();return}if(target.id==='addClass'||target.dataset.action==='new-class'){newClass();return}if(target.id==='settingsNav'||target.id==='helpButton'){showModal('Sobre Fernando’s room','<p>App educativo para gerir turmas, avisos, atividades e notas.</p><p style="color:var(--muted)">Esta versão guarda os dados neste navegador. Não tem contas de utilizador nem sincronização entre dispositivos.</p>','Fechar','close-info');return}if(target.dataset.action==='close-modal'){closeModal();return}if(target.dataset.action==='new-post'){newPost();return}if(target.dataset.action==='new-task'){newTask();return}if(target.dataset.action==='add-student'){showModal('Adicionar aluno',`<div class="field"><label>Nome do aluno *</label><input name="name" required placeholder="Nome completo"></div>`,'Adicionar','add-student');return}if(target.dataset.action==='copy-code'){copyCode();return}if(target.dataset.room){openRoom(target.dataset.room);return}if(target.dataset.openRoom){openRoom(target.dataset.openRoom);return}if(target.dataset.task){openTask(target.dataset.task);return}if(target.dataset.tab){activeTab=target.dataset.tab;renderRoom();return}}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('click',e=>{if(e.target.matches('[data-close-background]'))closeModal()});document.addEventListener('change',e=>{const input=e.target.closest('[data-grade-task]');if(!input)return;const r=getRoom(activeRoom),t=r?.tasks.find(x=>x.id===input.dataset.gradeTask);if(t){t.grades=t.grades||{};if(input.value==='')delete t.grades[input.dataset.gradeStudent];else t.grades[input.dataset.gradeStudent]=Math.max(0,Math.min(100,Number(input.value)||0));save();renderRoom()}});$('#menuButton').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));renderHome();
</script></body></html>
